# Supabase CLI configuration for local development (`supabase start`).
# Production settings are configured in the Supabase dashboard; see
# docs/DEPLOYMENT.md for the values that must match.
project_id = "internet-organism"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Hard cap on rows per request to limit scraping and heavy queries.
max_rows = 100

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/profile", "http://localhost:5173/reset-password", "http://localhost:4173/profile", "http://localhost:4173/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
# Not needed: visitors leave traces with no session at all (migration 6).
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.rate_limit]
# Per-IP limit on anonymous sign-ins (guest sessions) per hour.
anonymous_users = 30
sign_in_sign_ups = 30
email_sent = 4

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[functions.stripe-webhook]
verify_jwt = false

[functions.world-tick]
verify_jwt = false

[functions.create-checkout]
verify_jwt = false
